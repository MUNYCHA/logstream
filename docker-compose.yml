services:
  logstream:
    build: .
    expose:
      - "8080"
    volumes:
      - ${LOGSTREAM_LOG_DIR}:${LOGSTREAM_LOG_DIR}:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOGSTREAM_CHANNELS: ${LOGSTREAM_CHANNELS}
      LOGSTREAM_ALLOWED_ORIGINS: ${LOGSTREAM_ALLOWED_ORIGINS}
      LOGSTREAM_LOG_DIR: ${LOGSTREAM_LOG_DIR}
      JVM_MAX_HEAP: ${JVM_MAX_HEAP:-512m}
      SSO_JWKS_URI: ${SSO_JWKS_URI}
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_ORG_MUNYCHA_LOGSTREAM: INFO
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "2.0"
        reservations:
          memory: 384m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    external: true
