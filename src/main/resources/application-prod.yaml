server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SSO_JWKS_URI}

logstream:
  topics: ${LOGSTREAM_TOPICS}
  allowed-origins: ${LOGSTREAM_ALLOWED_ORIGINS}
  log-dir: ${LOGSTREAM_LOG_DIR}
  max-sessions-per-user: ${LOGSTREAM_MAX_SESSIONS_PER_USER:5}
  replay-buffer-size: ${LOGSTREAM_REPLAY_BUFFER_SIZE:500}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
