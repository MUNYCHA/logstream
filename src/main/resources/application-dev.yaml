server:
  port: 8080

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logstream:
  topics: server-topic,system-topic,app1-topic,app2-topic,app3-topic,app4-topic
  allowed-origins: http://localhost:5173
  log-dir: # set to local log directory if testing file download
  max-sessions-per-user: 5
  replay-buffer-size: 500
